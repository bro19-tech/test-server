<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Vocabulary Image Challenge</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(to right,#a8edea,#fed6e3);
    text-align:center;
    margin:0;
}

h1{ margin-top:20px; }

button{
    padding:8px 15px;
    margin:5px;
    border-radius:8px;
    border:none;
    background:#2e7d32;
    color:white;
    cursor:pointer;
}

button:hover{ background:#1b5e20; }

#gameArea{
    margin-top:30px;
}
 .questionBox{
    width:300px;
    height:300px;
    background:white;
    border-radius:25px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 25px auto;
    box-shadow:0 6px 12px rgba(0,0,0,0.2);
}

#questionImage{
    width:300px;
    height:300px;
    object-fit:cover;
    border-radius:20px;
    box-shadow:0 6px 12px rgba(0,0,0,0.2);
    margin-bottom:25px;
}

.options{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
}

.option{
    width:150px;
    height:150px;
    border-radius:15px;
    background:white;
    box-shadow:0 4px 8px rgba(0,0,0,0.2);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:0.3s;
}

.option img{
    width:140px;
    height:140px;
    object-fit:cover;
    border-radius:12px;
}

.option.correct{ background:#81c784; }
.option.wrong{ background:#ef5350; }

.hidden{ display:none; }
</style>
</head>

<body>

<h1>🌎 Vocabulary Image Challenge 🌎</h1>

<button onclick="startGame('easy')">Easy (5)</button>
<button onclick="startGame('medium')">Medium (10)</button>
<button onclick="startGame('hard')">Hard (15)</button>

<div id="gameArea" class="hidden">
    <div class="questionBox">
        <img id="questionImage">
    </div>
    <div class="options" id="optionsContainer"></div>
</div>

<script>

// 🔹 Bank campuran (Easy & Medium)
const mixedData = [
{ word:"MOUNTAIN", image:"assets/mixed/MOUNTAIN1.png" },
{ word:"EARTH", image:"assets/mixed/EARTH1.png" },
{ word:"STAR", image:"assets/mixed/STAR1.png" },
{ word:"TREE", image:"assets/mixed/TREE1.png" },
{ word:"SUN", image:"assets/mixed/SUN1.png" },
{ word:"OCEAN", image:"assets/mixed/OCEAN1.png" },
{ word:"ISLAND", image:"assets/mixed/ISLAND1.png" },
{ word:"CLOUD", image:"assets/mixed/CLOUD1.png" },
{ word:"RAIN", image:"assets/mixed/RAIN1.png" },
{ word:"DESERT", image:"assets/mixed/DESERT1.png" },
{ word:"WAVE", image:"assets/mixed/WAVE1.png" },
{ word:"LAKE", image:"assets/mixed/LAKE1.png" },
{ word:"CAVE", image:"assets/mixed/CAVE1.png" },
{ word:"ROCK", image:"assets/mixed/ROCK1.png" },
{ word:"SNOW", image:"assets/mixed/SNOW1.png" }
];

// 🔹 Bank khusus HARD
const hardData = [
{ word:"GLACIER", image:"assets/hard/GLACIER1.png" },
{ word:"ICEBERG", image:"assets/hard/ICEBERG1.png" },
{ word:"LANDSLIDE", image:"assets/hard/LANDSLIDE1.png" },
{ word:"LIGHTNING", image:"assets/hard/LIGHTNING1.png" },
{ word:"PENINSULA", image:"assets/hard/PENINSULA1.png" },
{ word:"CORAL REEF", image:"assets/hard/CORALREEF1.png" },
{ word:"POLLUTION", image:"assets/hard/POLLUTION1.png" },
{ word:"FOREST", image:"assets/hard/FOREST1.png" },
{ word:"VALLEY", image:"assets/hard/VALLEY1.png" },
{ word:"SOLAR PANEL", image:"assets/hard/SOLARPANEL1.png" },
{ word:"SWAMP", image:"assets/hard/SWAMP1.png" },
{ word:"COMPOST", image:"assets/hard/COMPOST1.png" },
{ word:"GREENHOUSE", image:"assets/hard/GREENHOUSE1.png" },
{ word:"FOG", image:"assets/hard/FOG1.png" },
{ word:"ECLIPSE", image:"assets/hard/ECLIPSE1.png" }
];

let questions = [];
let currentIndex = 0;
let totalQuestions = 5;
let optionCount = 3;
let locked = false;

function shuffle(array){
    return array.sort(()=>Math.random()-0.5);
}

function startGame(level){

    if(level==="easy"){
        totalQuestions=5;
        optionCount=3;
        questions = shuffle([...mixedData]).slice(0,totalQuestions);
    }

    if(level==="medium"){
        totalQuestions=10;
        optionCount=4;
        questions = shuffle([...mixedData]).slice(0,totalQuestions);
    }

    if(level==="hard"){
        totalQuestions=15;
        optionCount=5;
        questions = shuffle([...hardData]).slice(0,totalQuestions);
    }

    currentIndex = 0;
    document.getElementById("gameArea").classList.remove("hidden");
    loadQuestion();
}

function loadQuestion(){

    locked=false;
    const question = questions[currentIndex];

    const questionImage = document.getElementById("questionImage");
    questionImage.src = question.image; // gambar soal tetap dari assets
    questionImage.dataset.word = question.word;

    const optionsContainer = document.getElementById("optionsContainer");
    optionsContainer.innerHTML="";

    // 🔥 Semua opsi diambil dari folder images
    let sourceBank = [
        { word:"MOUNTAIN", image:"images/MOUNTAIN.png" },
        { word:"EARTH", image:"images/EARTH.png" },
        { word:"STAR", image:"images/STAR.png" },
        { word:"TREE", image:"images/TREE.png" },
        { word:"SUN", image:"images/SUN.png" },
        { word:"OCEAN", image:"images/OCEAN.png" },
        { word:"ISLAND", image:"images/ISLAND.png" },
        { word:"CLOUD", image:"images/CLOUD.png" },
        { word:"RAIN", image:"images/RAIN.png" },
        { word:"DESERT", image:"images/DESERT.png" },
        { word:"WAVE", image:"images/WAVE.png" },
        { word:"LAKE", image:"images/LAKE.png" },
        { word:"CAVE", image:"images/CAVE.png" },
        { word:"ROCK", image:"images/ROCK.png" },
        { word:"SNOW", image:"images/SNOW.png" },
        { word:"GLACIER", image:"images/GLACIER.png" },
        { word:"ICEBERG", image:"images/ICEBERG.png" },
        { word:"LANDSLIDE", image:"images/LANDSLIDE.png" },
        { word:"LIGHTNING", image:"images/LIGHTNING.png" },
        { word:"PENINSULA", image:"images/PENINSULA.png" },
        { word:"CORAL REEF", image:"images/CORALREEF.png" },
        { word:"POLLUTION", image:"images/POLLUTION.png" },
        { word:"FOREST", image:"images/FOREST.png" },
        { word:"VALLEY", image:"images/VALLEY.png" },
        { word:"SOLAR PANEL", image:"images/SOLARPANEL.png" },
        { word:"SWAMP", image:"images/SWAMP.png" },
        { word:"COMPOST", image:"images/COMPOST.png" },
        { word:"GREENHOUSE", image:"images/GREENHOUSE.png" },
        { word:"FOG", image:"images/FOG.png" },
        { word:"ECLIPSE", image:"images/ECLIPSE.png" }
    ];

    let wrongOptions = shuffle(
        sourceBank.filter(item=>item.word!==question.word)
    ).slice(0, optionCount-1);

    // Pastikan jawaban benar juga dari folder images
    let correctOption = sourceBank.find(item=>item.word===question.word);

    let allOptions = shuffle([correctOption,...wrongOptions]);

    allOptions.forEach(item=>{

        const div = document.createElement("div");
        div.className="option";
        div.dataset.word=item.word;

        div.innerHTML = `<img src="${item.image}">`;

        div.onclick = ()=>selectAnswer(div);

        div.draggable=true;
        div.ondragstart = (e)=>{
            e.dataTransfer.setData("word",item.word);
        };

        optionsContainer.appendChild(div);
    });

    questionImage.ondragover = (e)=>e.preventDefault();
    questionImage.ondrop = (e)=>{
        if(locked) return;
        const draggedWord = e.dataTransfer.getData("word");
        checkAnswer(draggedWord);
    };
}

function selectAnswer(div){
    if(locked) return;
    checkAnswer(div.dataset.word);
}

function checkAnswer(selectedWord){

    const correctWord = questions[currentIndex].word;
    const options = document.querySelectorAll(".option");

    if(selectedWord===correctWord){

        locked=true;

        options.forEach(opt=>{
            if(opt.dataset.word===correctWord){
                opt.classList.add("correct");
            }
        });

        setTimeout(()=>{
            currentIndex++;
            if(currentIndex<totalQuestions){
                loadQuestion();
            }else{
                alert("🎉 Level Complete!");
                document.getElementById("gameArea").classList.add("hidden");
            }
        },2000);

    }else{

        options.forEach(opt=>{
            if(opt.dataset.word===selectedWord){
                opt.classList.add("wrong");
                setTimeout(()=>opt.classList.remove("wrong"),800);
            }
        });

    }
}

</script>

</body>
</html>
